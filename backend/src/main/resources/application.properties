# ============================================================
# SmartDispatch Backend — Environment Configuration
# ============================================================

server.port=8080

# ============================================================
# ACTIVE PROFILE: Set to "dev" or "prod"
# dev  = H2 in-memory DB + local file storage
# prod = Supabase PostgreSQL + Cloudflare R2
# ============================================================
spring.profiles.active=dev

# ============================================================
# JPA Common
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# JWT
# ============================================================
jwt.secret=SmartDispatch2024SecretKeyForJWTTokenGenerationMustBe256BitsLong!!
jwt.expiration=43200000

# ============================================================
# File Upload
# ============================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# ============================================================
# CORS
# ============================================================
cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ============================================================
# Cloudflare R2 Storage (S3-compatible)
# Used for: product photos, seal evidence, AI vision captures
# ============================================================
r2.account-id=${R2_ACCOUNT_ID:}
r2.access-key=${R2_ACCESS_KEY:}
r2.secret-key=${R2_SECRET_KEY:}
r2.bucket=${R2_BUCKET:smartdispatch-assets}
r2.public-url=${R2_PUBLIC_URL:}

# ============================================================
# Storage mode: "local" or "r2"
# ============================================================
storage.mode=${STORAGE_MODE:local}
