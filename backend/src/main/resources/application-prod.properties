# ============================================================
# PROD PROFILE — Supabase PostgreSQL + Cloudflare R2
# ============================================================

# Supabase PostgreSQL
# Get these from: Supabase Dashboard → Settings → Database → Connection String
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://db.xxxx.supabase.co:5432/postgres}
spring.datasource.username=${SUPABASE_DB_USER:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD:your-supabase-password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Disable H2 console in production
spring.h2.console.enabled=false

# Use Cloudflare R2 for file storage
storage.mode=r2

# Redis
spring.data.redis.url=${REDIS_URL:}
spring.data.redis.password=${REDIS_API_KEY:}
