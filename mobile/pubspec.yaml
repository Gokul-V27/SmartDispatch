name: smartdispatch_mobile
description: SmartDispatch Packer Verification App — Camera-first dispatch verification.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0

  # State Management
  provider: ^6.1.1

  # Networking
  http: ^1.2.0
  shared_preferences: ^2.2.2

  # Camera & OCR
  camera: ^0.11.0
  google_mlkit_text_recognition: ^0.13.0

  # Image handling
  image_picker: ^1.0.7

  # QR/Barcode scanning
  mobile_scanner: ^5.1.1

  # Navigation
  go_router: ^13.2.0

  # Local storage
  path_provider: ^2.1.2

  # Permissions
  permission_handler: ^11.3.0
  flutter_secure_storage: ^10.3.1
  crypto: ^3.0.7
  connectivity_plus: ^7.1.1
  mqtt_client: ^10.11.11
  drift: ^2.33.0
  drift_flutter: ^0.3.0
  sqlite3_flutter_libs: ^0.6.0+eol

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/
