name: smartdispatch_mobile
description: SmartDispatch Packer & Customer App — Dual-role dispatch verification.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0

  # State Management
  provider: ^6.1.1

  # Networking
  http: ^1.2.0
  shared_preferences: ^2.2.2

  # Camera & OCR — real scanning on physical devices
  camera: any
  google_mlkit_text_recognition: any
  image_picker: ^1.0.7

  # QR / Barcode scanning
  mobile_scanner: ^5.1.1
  google_mlkit_barcode_scanning: any
  google_mlkit_image_labeling: any
  google_mlkit_object_detection: any
  flutter_nfc_kit: ^3.4.0
  ndef: ^0.3.4
  encrypt: ^5.0.3

  dio: ^5.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/
